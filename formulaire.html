<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire</title>
</head>

<body>
    <form id="monFormulaire">
        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" required>
        </div>

        <button type="submit" id="submitBtn" disabled>S'inscrire</button>
    </form>

    <script>
        function validerMotDePasse(motDePasse) {
            // au moins 8 caractères, au moins une lettre et au moins un chiffre
            const regex = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[!@#%]).{8,}$/;
            return regex.test(motDePasse);
        }

        const inputPassword = document.getElementById('password');
        const passwordStrengthFeedback = document.getElementById('password-strength-feedback');

        inputPassword.addEventListener('input', (e) => {
            const estValide = validerMotDePasse(e.target.value);

            if (estValide) {
                passwordStrengthFeedback.textContent = 'Le mot de passe est valide'
            } else {
                passwordStrengthFeedback.textContent = 'Le mot de passe doit contenir au moins un chiffre, une lettre et faire 8 caractères'
            }
        });
    </script>
</body>

</html>
